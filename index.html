<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Building the AI-first Developer Stack</title>
    <meta
      name="description"
      content="Slides for Building the AI-first Developer Stack."
    >
    <meta property="og:title" content="Building the AI-first Developer Stack">
    <meta
      property="og:description"
      content="View or download the Building the AI-first Developer Stack PDF."
    >
    <meta property="og:type" content="website">
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f0;
        --panel: #ffffff;
        --text: #191919;
        --muted: #5d625f;
        --line: #d9d7cf;
        --accent: #007c89;
        --accent-strong: #04515b;
        --shadow: 0 18px 45px rgba(25, 25, 25, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100%;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        padding: 18px clamp(16px, 4vw, 40px);
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2.4vw, 2rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      .meta {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 16px;
        color: var(--text);
        background: var(--panel);
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
        white-space: nowrap;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .button:hover {
        border-color: var(--accent-strong);
      }

      main {
        min-height: 0;
        padding: clamp(12px, 2vw, 24px);
      }

      .viewer {
        width: 100%;
        height: calc(100vh - 112px);
        min-height: 520px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      iframe,
      object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .fallback {
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 28px;
        text-align: center;
      }

      .fallback p {
        max-width: 36rem;
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        header {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .actions {
          justify-content: stretch;
        }

        .button {
          flex: 1 1 140px;
        }

        .viewer {
          height: calc(100vh - 176px);
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>Building the AI-first Developer Stack</h1>
          <p class="meta">PDF slides</p>
        </div>
        <nav class="actions" aria-label="PDF actions">
          <a class="button primary" href="assets/building-the-ai-first-developer-stack.pdf">Open PDF</a>
          <a class="button" href="assets/building-the-ai-first-developer-stack.pdf" download>Download</a>
        </nav>
      </header>

      <main>
        <section class="viewer" aria-label="PDF viewer">
          <object
            data="assets/building-the-ai-first-developer-stack.pdf"
            type="application/pdf"
          >
            <div class="fallback">
              <p>
                This browser cannot show the embedded PDF. Use the Open PDF or
                Download action above.
              </p>
            </div>
          </object>
        </section>
      </main>
    </div>
  </body>
</html>
